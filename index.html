<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lift Explorer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0f0f0f;
            --surface: #1a1a1a;
            --surface-hover: #252525;
            --text: #ffffff;
            --text-secondary: #888;
            --accent: #00d084;
            --danger: #ff4757;
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            overflow-x: hidden;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(15, 15, 15, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            z-index: 100;
            padding: 12px 16px;
        }

        .header-content {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 36px;
            height: 36px;
            background: var(--accent);
            border-radius: 10px;
            display: grid;
            place-items: center;
            font-weight: 700;
            font-size: 14px;
            flex-shrink: 0;
        }

        .search-box {
            flex: 1;
            position: relative;
        }

        .search-box input {
            width: 100%;
            background: var(--surface);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: var(--radius);
            padding: 10px 12px 10px 36px;
            color: var(--text);
            font-size: 15px;
            outline: none;
        }

        .search-box input:focus {
            border-color: var(--accent);
        }

        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 14px;
        }

        .filter-btn {
            width: 40px;
            height: 40px;
            background: var(--surface);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: var(--radius);
            color: var(--text);
            display: grid;
            place-items: center;
            cursor: pointer;
        }

        .filter-btn.active {
            background: var(--accent);
            color: var(--bg);
        }

        .stats {
            max-width: 800px;
            margin: 80px auto 8px;
            padding: 0 16px;
            display: flex;
            gap: 16px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .stats span {
            color: var(--text);
            font-weight: 600;
        }

        .list-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 16px 100px;
        }

        .lift-card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 8px;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            gap: 12px;
            transition: transform 0.1s;
        }

        .lift-card:active {
            transform: scale(0.98);
            background: var(--surface-hover);
        }

        .lift-icon {
            width: 48px;
            height: 48px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            display: grid;
            place-items: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .lift-info {
            flex: 1;
            min-width: 0;
        }

        .lift-name {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .lift-meta {
            font-size: 13px;
            color: var(--text-secondary);
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .status-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            flex-shrink: 0;
        }

        .status-active { background: rgba(0, 208, 132, 0.15); color: var(--accent); }
        .status-dismessa { background: rgba(255, 71, 87, 0.15); color: var(--danger); }
        .status-other { background: rgba(255,255,255,0.1); color: var(--text-secondary); }

        .empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty i {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            text-align: center;
            padding: 40px 20px;
            color: var(--danger);
        }

        .retry-btn {
            margin-top: 16px;
            padding: 10px 20px;
            background: var(--surface);
            border: 1px solid var(--danger);
            color: var(--danger);
            border-radius: var(--radius);
            cursor: pointer;
        }

        /* Sheet */
        .sheet-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
            z-index: 200;
        }

        .sheet-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .sheet {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--surface);
            border-radius: 24px 24px 0 0;
            max-height: 85vh;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 201;
            display: flex;
            flex-direction: column;
        }

        .sheet.active {
            transform: translateY(0);
        }

        .sheet-handle {
            width: 40px;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            margin: 12px auto;
        }

        .sheet-header {
            padding: 0 20px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .sheet-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .sheet-subtitle {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .sheet-content {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .detail-label {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .detail-value {
            font-weight: 500;
            font-size: 14px;
            text-align: right;
        }

        .notes-section {
            margin-top: 16px;
            padding: 16px;
            background: var(--bg);
            border-radius: var(--radius);
        }

        .notes-label {
            font-size: 12px;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .notes-text {
            font-size: 14px;
            line-height: 1.6;
        }

        .sheet-close {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 32px;
            height: 32px;
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 50%;
            color: var(--text);
            cursor: pointer;
        }

        /* Filter Modal */
        .filter-modal {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 150;
            display: none;
            flex-direction: column;
            padding: 20px;
        }

        .filter-modal.active {
            display: flex;
        }

        .filter-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .filter-title {
            font-size: 20px;
            font-weight: 700;
        }

        .filter-option {
            padding: 16px;
            background: var(--surface);
            border-radius: var(--radius);
            margin-bottom: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .filter-option.selected {
            border: 1px solid var(--accent);
        }

        .filter-option.selected i {
            color: var(--accent);
        }

        /* Desktop */
        @media (min-width: 768px) {
            .lift-card { display: none; }
            
            .table-view {
                display: table;
                width: 100%;
                border-collapse: collapse;
                font-size: 14px;
            }

            .table-view th {
                text-align: left;
                padding: 12px 16px;
                color: var(--text-secondary);
                font-weight: 600;
                font-size: 12px;
                text-transform: uppercase;
                border-bottom: 1px solid rgba(255,255,255,0.1);
                cursor: pointer;
            }

            .table-view td {
                padding: 16px;
                border-bottom: 1px solid rgba(255,255,255,0.05);
            }

            .table-view tr {
                cursor: pointer;
                transition: background 0.2s;
            }

            .table-view tr:hover {
                background: var(--surface-hover);
            }

            .sheet {
                left: auto;
                right: 20px;
                top: 50%;
                bottom: auto;
                transform: translate(100%, -50%);
                width: 400px;
                max-height: 80vh;
                border-radius: var(--radius);
            }

            .sheet.active {
                transform: translate(0, -50%);
            }

            .sheet-handle { display: none; }
        }

        @media (max-width: 767px) {
            .table-view { display: none; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <div class="logo">LE</div>
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Cerca impianti..." autocomplete="off">
            </div>
            <button class="filter-btn" id="filterBtn">
                <i class="fas fa-filter"></i>
            </button>
        </div>
    </header>

    <div class="stats">
        <div>Totale: <span id="totalCount">-</span></div>
        <div>Mostrati: <span id="filteredCount">-</span></div>
    </div>

    <main class="list-container" id="listContainer">
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Caricamento dati...</p>
        </div>
    </main>

    <!-- Filter Modal -->
    <div class="filter-modal" id="filterModal">
        <div class="filter-header">
            <h2 class="filter-title">Filtra per stato</h2>
            <button class="filter-btn" onclick="closeFilterModal()" style="width:36px;height:36px;">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="filter-option selected" data-value="">
            <span>Tutti gli stati</span>
            <i class="fas fa-check"></i>
        </div>
        <div class="filter-option" data-value="In servizio">
            <span>In servizio</span>
            <i class="fas fa-check"></i>
        </div>
        <div class="filter-option" data-value="Dismessa">
            <span>Dismessa</span>
            <i class="fas fa-check"></i>
        </div>
        <div class="filter-option" data-value="In costruzione">
            <span>In costruzione</span>
            <i class="fas fa-check"></i>
        </div>
        <div class="filter-option" data-value="Progettata">
            <span>Progettata</span>
            <i class="fas fa-check"></i>
        </div>
    </div>

    <!-- Detail Sheet -->
    <div class="sheet-overlay" id="sheetOverlay"></div>
    <div class="sheet" id="detailSheet">
        <div class="sheet-handle"></div>
        <button class="sheet-close" onclick="closeDetail()">
            <i class="fas fa-times"></i>
        </button>
        <div class="sheet-header">
            <div class="sheet-title" id="detailName">-</div>
            <div class="sheet-subtitle" id="detailLocation">-</div>
        </div>
        <div class="sheet-content">
            <div class="detail-row">
                <span class="detail-label">Tipologia</span>
                <span class="detail-value" id="detailType">-</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Costruttore</span>
                <span class="detail-value" id="detailBuilder">-</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Anno costruzione</span>
                <span class="detail-value" id="detailYear">-</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Stato</span>
                <span class="detail-value" id="detailStatus">-</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Resort</span>
                <span class="detail-value" id="detailResort">-</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Comprensorio</span>
                <span class="detail-value" id="detailArea">-</span>
            </div>
            <div class="notes-section" id="notesSection" style="display: none;">
                <div class="notes-label">Note</div>
                <div class="notes-text" id="detailNotes">-</div>
            </div>
        </div>
    </div>

    <script>
        // Configurazione
        const CONFIG = {
            dataUrl: 'dati.json',
            fallbackData: [
                {
                    "LUOGO": "Cortina d'Ampezzo",
                    "PR.": "BL",
                    "TIPOLOGIA": "Cabinovia",
                    "NOME": "Faloria",
                    "COSTRUTTORE": "Leitner",
                    "COSTRUZIONE": 2020,
                    "DISMISSIONE": null,
                    "STATO": "In servizio",
                    "Resort": "Cortina",
                    "Comprensorio": "Dolomiti Superski",
                    "Zona": "Faloria-Cristallo",
                    "Note": "Impianto rinnovato per le Olimpiadi 2026"
                },
                {
                    "LUOGO": "Breuil-Cervinia",
                    "PR.": "AO",
                    "TIPOLOGIA": "Funivia",
                    "NOME": "Plateau Rosa",
                    "COSTRUTTORE": "Poma",
                    "COSTRUZIONE": 2012,
                    "DISMISSIONE": null,
                    "STATO": "In servizio",
                    "Resort": "Cervinia",
                    "Comprensorio": "Matterhorn Ski Paradise",
                    "Zona": "Plateau Rosa",
                    "Note": null
                },
                {
                    "LUOGO": "Sestriere",
                    "PR.": "TO",
                    "TIPOLOGIA": "Seggiovia",
                    "NOME": "Banchetta",
                    "COSTRUTTORE": "Doppelmayr",
                    "COSTRUZIONE": 1998,
                    "DISMISSIONE": 2018,
                    "STATO": "Dismessa",
                    "Resort": "Via Lattea",
                    "Comprensorio": "Milky Way",
                    "Zona": "Colle di Sestriere",
                    "Note": "Sostituita con nuova seggiovia a 6 posti"
                }
            ]
        };

        // Stato
        let allData = [];
        let filtered = [];
        let currentFilter = '';
        let sortCol = null;
        let sortAsc = true;

        // Icone
        const icons = {
            'Cabinovia': 'fa-cable-car',
            'Funivia': 'fa-mountain',
            'Seggiovia': 'fa-chair',
            'Skilift': 'fa-arrow-up',
            'default': 'fa-mountain'
        };

        // Inizializzazione
        async function init() {
            try {
                await loadData();
            } catch (error) {
                console.warn('Errore caricamento, uso fallback:', error);
                allData = CONFIG.fallbackData;
            }
            filtered = [...allData];
            setupEventListeners();
            render();
        }

        async function loadData() {
            const response = await fetch(CONFIG.dataUrl);
            if (!response.ok) throw new Error('HTTP ' + response.status);
            allData = await response.json();
        }

        function getIcon(tipo) {
            return icons[tipo] || icons.default;
        }

        function getStatusClass(stato) {
            if (!stato) return 'status-other';
            if (stato.includes('servizio')) return 'status-active';
            if (stato.includes('Dismess')) return 'status-dismessa';
            return 'status-other';
        }

        function render() {
            const container = document.getElementById('listContainer');
            
            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty">
                        <i class="fas fa-search"></i>
                        <h3>Nessun risultato</h3>
                        <p>Prova a modificare i filtri</p>
                    </div>
                `;
                updateStats();
                return;
            }

            // Mobile cards
            const cardsHtml = filtered.map((item, i) => `
                <div class="lift-card" onclick="openDetail(${i})">
                    <div class="lift-icon">
                        <i class="fas ${getIcon(item.TIPOLOGIA)}"></i>
                    </div>
                    <div class="lift-info">
                        <div class="lift-name">${escape(item.NOME)}</div>
                        <div class="lift-meta">
                            <span><i class="fas fa-map-marker-alt"></i> ${escape(item.LUOGO)}</span>
                            <span>•</span>
                            <span>${escape(item.TIPOLOGIA)}</span>
                        </div>
                    </div>
                    <span class="status-badge ${getStatusClass(item.STATO)}">${escape(item.STATO)}</span>
                </div>
            `).join('');

            // Desktop table
            const tableHtml = `
                <table class="table-view">
                    <thead>
                        <tr>
                            <th onclick="sort('LUOGO')">Località ${sortCol === 'LUOGO' ? (sortAsc ? '↑' : '↓') : ''}</th>
                            <th onclick="sort('NOME')">Nome ${sortCol === 'NOME' ? (sortAsc ? '↑' : '↓') : ''}</th>
                            <th onclick="sort('TIPOLOGIA')">Tipo ${sortCol === 'TIPOLOGIA' ? (sortAsc ? '↑' : '↓') : ''}</th>
                            <th onclick="sort('COSTRUTTORE')">Costruttore ${sortCol === 'COSTRUTTORE' ? (sortAsc ? '↑' : '↓') : ''}</th>
                            <th onclick="sort('COSTRUZIONE')">Anno ${sortCol === 'COSTRUZIONE' ? (sortAsc ? '↑' : '↓') : ''}</th>
                            <th>Stato</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${filtered.map((item, i) => `
                            <tr onclick="openDetail(${i})">
                                <td>${escape(item.LUOGO)} <span style="opacity:0.5">(${escape(item['PR.'])})</span></td>
                                <td><strong>${escape(item.NOME)}</strong></td>
                                <td>${escape(item.TIPOLOGIA)}</td>
                                <td>${escape(item.COSTRUTTORE)}</td>
                                <td>${item.COSTRUZIONE || '-'}</td>
                                <td><span class="status-badge ${getStatusClass(item.STATO)}">${escape(item.STATO)}</span></td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;

            container.innerHTML = cardsHtml + tableHtml;
            updateStats();
        }

        function updateStats() {
            document.getElementById('totalCount').textContent = allData.length;
            document.getElementById('filteredCount').textContent = filtered.length;
        }

        function escape(text) {
            if (!text) return '-';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function filter() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            
            filtered = allData.filter(item => {
                const matchesSearch = !query || 
                    (item.NOME?.toLowerCase().includes(query)) ||
                    (item.LUOGO?.toLowerCase().includes(query)) ||
                    (item.COSTRUTTORE?.toLowerCase().includes(query));
                
                const matchesStatus = !currentFilter || item.STATO === currentFilter;
                
                return matchesSearch && matchesStatus;
            });

            if (sortCol) sortData();
            render();
        }

        function sort(col) {
            if (sortCol === col) {
                sortAsc = !sortAsc;
            } else {
                sortCol = col;
                sortAsc = true;
            }
            sortData();
            render();
        }

        function sortData() {
            filtered.sort((a, b) => {
                let valA = a[sortCol] || '';
                let valB = b[sortCol] || '';
                
                if (typeof valA === 'number' && typeof valB === 'number') {
                    return sortAsc ? valA - valB : valB - valA;
                }
                
                valA = String(valA).toLowerCase();
                valB = String(valB).toLowerCase();
                
                if (valA < valB) return sortAsc ? -1 : 1;
                if (valA > valB) return sortAsc ? 1 : -1;
                return 0;
            });
        }

        function openDetail(index) {
            const item = filtered[index];
            if (!item) return;

            document.getElementById('detailName').textContent = item.NOME || 'N/D';
            document.getElementById('detailLocation').textContent = item.LUOGO + (item['PR.'] ? ` (${item['PR.']})` : '');
            document.getElementById('detailType').textContent = item.TIPOLOGIA || '-';
            document.getElementById('detailBuilder').textContent = item.COSTRUTTORE || '-';
            document.getElementById('detailYear').textContent = item.COSTRUZIONE || '-';
            document.getElementById('detailStatus').textContent = item.STATO || '-';
            document.getElementById('detailResort').textContent = item.Resort || '-';
            document.getElementById('detailArea').textContent = item.Comprensorio || '-';
            
            const notesSection = document.getElementById('notesSection');
            if (item.Note) {
                document.getElementById('detailNotes').textContent = item.Note;
                notesSection.style.display = 'block';
            } else {
                notesSection.style.display = 'none';
            }

            document.getElementById('sheetOverlay').classList.add('active');
            document.getElementById('detailSheet').classList.add('active');
        }

        function closeDetail() {
            document.getElementById('sheetOverlay').classList.remove('active');
            document.getElementById('detailSheet').classList.remove('active');
        }

        function closeFilterModal() {
            document.getElementById('filterModal').classList.remove('active');
        }

        function setupEventListeners() {
            // Search
            document.getElementById('searchInput').addEventListener('input', debounce(filter, 300));
            
            // Filter modal
            document.getElementById('filterBtn').addEventListener('click', () => {
                document.getElementById('filterModal').classList.add('active');
            });
            
            document.querySelectorAll('.filter-option').forEach(opt => {
                opt.addEventListener('click', function() {
                    document.querySelectorAll('.filter-option').forEach(o => o.classList.remove('selected'));
                    this.classList.add('selected');
                    currentFilter = this.dataset.value;
                    closeFilterModal();
                    filter();
                });
            });
            
            // Close sheet
            document.getElementById('sheetOverlay').addEventListener('click', closeDetail);
            
            // Escape key
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeDetail();
                    closeFilterModal();
                }
            });
        }

        function debounce(fn, wait) {
            let timeout;
            return (...args) => {
                clearTimeout(timeout);
                timeout = setTimeout(() => fn(...args), wait);
            };
        }

        // Swipe to close
        let touchStartY = 0;
        const sheet = document.getElementById('detailSheet');
        
        sheet.addEventListener('touchstart', e => {
            touchStartY = e.touches[0].clientY;
        });

        sheet.addEventListener('touchmove', e => {
            const touchY = e.touches[0].clientY;
            const diff = touchY - touchStartY;
            if (diff > 0 && sheet.scrollTop === 0) {
                sheet.style.transform = `translateY(${diff}px)`;
            }
        });

        sheet.addEventListener('touchend', e => {
            const touchY = e.changedTouches[0].clientY;
            if (touchY - touchStartY > 100) {
                closeDetail();
            }
            sheet.style.transform = '';
        });

        // Avvia
        init();
    </script>
</body>
</html>
