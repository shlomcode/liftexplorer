<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lift Explorer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #00d084;
            --secondary: #ff6b35;
            --dark: #0a0a0a;
            --surface: #141414;
            --surface-hover: #1f1f1f;
            --border: #2a2a2a;
            --text: #ffffff;
            --text-secondary: #888;
            --radius: 12px;
            --sidebar-width: 300px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--dark);
            color: var(--text);
            line-height: 1.5;
            overflow-x: hidden;
        }

        /* Layout */
        .app-container {
            display: grid;
            grid-template-columns: 1fr;
            max-width: 1400px;
            margin: 0 auto;
            min-height: 100vh;
        }

        /* Sidebars */
        .sidebar {
            display: none;
            background: var(--surface);
            border-right: 1px solid var(--border);
            padding: 20px;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
        }

        .sidebar-right {
            border-right: none;
            border-left: 1px solid var(--border);
        }

        /* Ad Containers */
        .ad-box {
            background: var(--dark);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 20px;
            overflow: hidden;
        }

        .ad-label {
            background: var(--surface);
            padding: 8px 12px;
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border);
        }

        .ad-content {
            min-height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 13px;
        }

        .ad-content.large {
            min-height: 600px;
        }

        /* Header */
        header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 40px;
            height: 40px;
            background: var(--primary);
            border-radius: 10px;
            display: grid;
            place-items: center;
            font-weight: 700;
            font-size: 16px;
            color: var(--dark);
            flex-shrink: 0;
        }

        .search-box {
            flex: 1;
            position: relative;
        }

        .search-box input {
            width: 100%;
            background: var(--dark);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px 12px 12px 40px;
            color: var(--text);
            font-size: 15px;
            outline: none;
        }

        .search-box input:focus {
            border-color: var(--primary);
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* Filters */
        .filters {
            max-width: 800px;
            margin: 0 auto;
            padding: 12px 16px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .filters::-webkit-scrollbar {
            display: none;
        }

        .chip {
            padding: 8px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .chip.active {
            background: var(--primary);
            border-color: var(--primary);
            color: var(--dark);
            font-weight: 600;
        }

        /* Stats */
        .stats {
            max-width: 800px;
            margin: 0 auto;
            padding: 8px 16px 16px;
            display: flex;
            gap: 20px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .stats span {
            color: var(--text);
            font-weight: 600;
        }

        /* Main Content */
        .main-content {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 16px 100px;
        }

        /* Table */
        .table-wrapper {
            overflow-x: auto;
            margin: 0 -16px;
            padding: 0 16px;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 14px;
            min-width: 650px;
        }

        th {
            text-align: left;
            padding: 12px 8px;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid var(--border);
            cursor: pointer;
            white-space: nowrap;
            position: sticky;
            top: 0;
            background: var(--dark);
        }

        th:first-child { padding-left: 16px; }
        th:last-child { padding-right: 16px; }

        td {
            padding: 16px 8px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }

        td:first-child { padding-left: 16px; }
        td:last-child { padding-right: 16px; }

        tr {
            cursor: pointer;
            transition: background 0.15s;
        }

        tr:hover { background: var(--surface); }

        .cell-main {
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 180px;
        }

        .cell-sub {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .cell-location {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .cell-location i {
            color: var(--primary);
            font-size: 12px;
        }

        .province-badge {
            display: inline-block;
            background: var(--surface);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-left: 6px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-badge::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        .status-active {
            background: rgba(0, 208, 132, 0.15);
            color: var(--primary);
        }
        .status-active::before {
            background: var(--primary);
            box-shadow: 0 0 6px var(--primary);
        }

        .status-dismessa {
            background: rgba(255, 107, 53, 0.15);
            color: var(--secondary);
        }
        .status-dismessa::before { background: var(--secondary); }

        .status-other {
            background: rgba(136, 136, 136, 0.15);
            color: var(--text-secondary);
        }
        .status-other::before { background: var(--text-secondary); }

        .year-cell {
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 13px;
            color: var(--text-secondary);
            text-align: center;
        }

        /* Cards Mobile */
        .cards-view { display: none; }

        .lift-card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 12px;
            cursor: pointer;
            border: 1px solid var(--border);
        }

        .lift-card:active {
            transform: scale(0.98);
            border-color: var(--primary);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .card-title {
            font-weight: 600;
            font-size: 16px;
            padding-right: 12px;
        }

        .card-meta {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .card-meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-meta-item i {
            font-size: 12px;
            width: 16px;
            text-align: center;
        }

        /* Detail View - Center Modal (Desktop) / Bottom Sheet (Mobile) */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
            z-index: 200;
            backdrop-filter: blur(4px);
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .detail-modal {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) scale(0.95);
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            background: var(--surface);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
            z-index: 201;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }

        .detail-modal.active {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        .detail-header {
            padding: 24px;
            border-bottom: 1px solid var(--border);
            position: relative;
        }

        .detail-close {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 36px;
            height: 36px;
            background: var(--dark);
            border: 1px solid var(--border);
            border-radius: 50%;
            color: var(--text);
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: all 0.2s;
        }

        .detail-close:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .detail-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            padding-right: 40px;
        }

        .detail-subtitle {
            color: var(--text-secondary);
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .detail-content {
            padding: 24px;
            overflow-y: auto;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .detail-item {
            background: var(--dark);
            padding: 16px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
        }

        .detail-item.wide {
            grid-column: 1 / -1;
        }

        .detail-label {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .detail-value {
            font-weight: 600;
            font-size: 16px;
        }

        .detail-notes {
            background: var(--dark);
            padding: 20px;
            border-radius: var(--radius);
            border-left: 3px solid var(--primary);
            border: 1px solid var(--border);
            border-left-width: 3px;
        }

        .detail-notes-label {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--primary);
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .detail-notes-text {
            font-size: 15px;
            line-height: 1.7;
            color: var(--text-secondary);
        }

        /* Empty & Loading */
        .empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }
        .empty i { font-size: 48px; margin-bottom: 16px; opacity: 0.3; }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Desktop Layout */
        @media (min-width: 1024px) {
            .app-container {
                grid-template-columns: var(--sidebar-width) 1fr var(--sidebar-width);
            }

            .sidebar { display: block; }

            header {
                position: relative;
                border-bottom: none;
                background: transparent;
                padding: 24px 0 16px;
            }

            .header-content, .filters, .stats, .main-content {
                max-width: none;
                margin: 0;
            }

            .table-wrapper {
                margin: 0;
                padding: 0;
                background: var(--surface);
                border-radius: var(--radius);
                border: 1px solid var(--border);
            }

            th { background: var(--surface); }
            th:first-child { border-radius: var(--radius) 0 0 0; }
            th:last-child { border-radius: 0 var(--radius) 0 0; }

            tr:hover { background: var(--surface-hover); }
        }

        /* Tablet */
        @media (min-width: 768px) and (max-width: 1023px) {
            .table-wrapper {
                margin: 0;
                padding: 0;
            }
        }

        /* Mobile */
        @media (max-width: 767px) {
            .table-wrapper { display: none; }
            .cards-view { display: block; }

            /* Mobile: Bottom Sheet instead of Center Modal */
            .detail-modal {
                left: 0;
                right: 0;
                top: auto;
                bottom: 0;
                transform: translateY(100%);
                width: 100%;
                max-width: none;
                max-height: 85vh;
                border-radius: 24px 24px 0 0;
                border: none;
                border-top: 1px solid var(--border);
            }

            .detail-modal.active {
                transform: translateY(0);
            }

            .detail-grid {
                grid-template-columns: 1fr 1fr;
            }

            .detail-header { padding: 16px 20px 20px; }
            .detail-title { font-size: 20px; }
            .detail-content { padding: 20px; }
        }

        @media (max-width: 480px) {
            .detail-grid { grid-template-columns: 1fr; }
            .detail-item.wide { grid-column: 1; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Left Sidebar - Ads -->
        <aside class="sidebar">
            <div class="ad-box">
                <div class="ad-label">Pubblicità</div>
                <div class="ad-content">
                    <!-- INSERISCI QUI IL CODICE ADS -->
                    300x250
                </div>
            </div>
            <div class="ad-box">
                <div class="ad-label">Sponsor</div>
                <div class="ad-content">
                    <!-- INSERISCI QUI IL CODICE ADS -->
                    300x250
                </div>
            </div>
        </aside>

        <!-- Main -->
        <main>
            <header>
                <div class="header-content">
                    <div class="logo">LE</div>
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="searchInput" placeholder="Cerca impianti per nome, località, costruttore...">
                    </div>
                </div>
            </header>

            <div class="filters" id="filterChips">
                <div class="chip active" data-value="">Tutti</div>
                <div class="chip" data-value="In servizio">In servizio</div>
                <div class="chip" data-value="Dismessa">Dismesse</div>
                <div class="chip" data-value="In costruzione">In costruzione</div>
                <div class="chip" data-value="Progettata">Progettate</div>
            </div>

            <div class="stats">
                <div>Totale: <span id="totalCount">-</span></div>
                <div>Filtrati: <span id="filteredCount">-</span></div>
            </div>

            <div class="main-content" id="content">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Caricamento dati...</p>
                </div>
            </div>
        </main>

        <!-- Right Sidebar - Ads -->
        <aside class="sidebar sidebar-right">
            <div class="ad-box">
                <div class="ad-label">Pubblicità</div>
                <div class="ad-content large">
                    <!-- INSERISCI QUI IL CODICE ADS -->
                    300x600
                </div>
            </div>
        </aside>
    </div>

    <!-- Detail Modal (Center on Desktop, Bottom Sheet on Mobile) -->
    <div class="overlay" id="overlay"></div>
    <div class="detail-modal" id="detailModal">
        <div class="detail-header">
            <button class="detail-close" onclick="closeDetail()">
                <i class="fas fa-times"></i>
            </button>
            <div class="detail-title" id="detailName">-</div>
            <div class="detail-subtitle">
                <i class="fas fa-map-marker-alt"></i>
                <span id="detailLocation">-</span>
            </div>
        </div>
        <div class="detail-content">
            <div class="detail-grid">
                <div class="detail-item">
                    <div class="detail-label">Tipologia</div>
                    <div class="detail-value" id="detailType">-</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Stato</div>
                    <div class="detail-value" id="detailStatus">-</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Costruttore</div>
                    <div class="detail-value" id="detailBuilder">-</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Anno Costruzione</div>
                    <div class="detail-value" id="detailYear">-</div>
                </div>
                <div class="detail-item wide">
                    <div class="detail-label">Comprensorio / Resort</div>
                    <div class="detail-value" id="detailArea">-</div>
                </div>
            </div>
            <div class="detail-notes" id="notesBox" style="display: none;">
                <div class="detail-notes-label">Note Tecniche</div>
                <div class="detail-notes-text" id="detailNotes">-</div>
            </div>
        </div>
    </div>

    <script>
        // Config
        const CONFIG = {
            dataUrl: 'dati.json',
            fallbackData: [
                {
                    "LUOGO": "Cortina d'Ampezzo",
                    "PR.": "BL",
                    "TIPOLOGIA": "Cabinovia",
                    "NOME": "Faloria",
                    "COSTRUTTORE": "Leitner",
                    "COSTRUZIONE": 2020,
                    "DISMISSIONE": null,
                    "STATO": "In servizio",
                    "Resort": "Cortina",
                    "Comprensorio": "Dolomiti Superski",
                    "Zona": "Faloria-Cristallo",
                    "Note": "Impianto rinnovato per le Olimpiadi 2026. Cabinovia 10 posti con cabine panoramiche."
                },
                {
                    "LUOGO": "Breuil-Cervinia",
                    "PR.": "AO",
                    "TIPOLOGIA": "Funivia",
                    "NOME": "Plateau Rosa",
                    "COSTRUTTORE": "Poma",
                    "COSTRUZIONE": 2012,
                    "DISMISSIONE": null,
                    "STATO": "In servizio",
                    "Resort": "Cervinia",
                    "Comprensorio": "Matterhorn Ski Paradise",
                    "Zona": "Plateau Rosa",
                    "Note": null
                },
                {
                    "LUOGO": "Sestriere",
                    "PR.": "TO",
                    "TIPOLOGIA": "Seggiovia",
                    "NOME": "Banchetta",
                    "COSTRUTTORE": "Doppelmayr",
                    "COSTRUZIONE": 1998,
                    "DISMISSIONE": 2018,
                    "STATO": "Dismessa",
                    "Resort": "Via Lattea",
                    "Comprensorio": "Milky Way",
                    "Zona": "Colle di Sestriere",
                    "Note": "Sostituita con nuova seggiovia a 6 posti"
                }
            ]
        };

        let allData = [];
        let filtered = [];
        let currentFilter = '';

        async function init() {
            try {
                const response = await fetch(CONFIG.dataUrl);
                if (!response.ok) throw new Error('HTTP ' + response.status);
                allData = await response.json();
            } catch (error) {
                console.warn('Fallback:', error);
                allData = CONFIG.fallbackData;
            }
            filtered = [...allData];
            setupEvents();
            render();
        }

        function setupEvents() {
            document.getElementById('searchInput').addEventListener('input', debounce(filter, 300));
            
            document.querySelectorAll('.chip').forEach(chip => {
                chip.addEventListener('click', function() {
                    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.dataset.value;
                    filter();
                });
            });

            document.getElementById('overlay').addEventListener('click', closeDetail);
            document.addEventListener('keydown', e => {
                if (e.key === 'Escape') closeDetail();
            });
        }

        function filter() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            
            filtered = allData.filter(item => {
                const matchesSearch = !query || 
                    (item.NOME?.toLowerCase().includes(query)) ||
                    (item.LUOGO?.toLowerCase().includes(query)) ||
                    (item.COSTRUTTORE?.toLowerCase().includes(query));
                
                const matchesStatus = !currentFilter || item.STATO === currentFilter;
                
                return matchesSearch && matchesStatus;
            });

            render();
        }

        function render() {
            const container = document.getElementById('content');
            
            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty">
                        <i class="fas fa-search"></i>
                        <h3>Nessun risultato</h3>
                        <p>Prova con altri termini di ricerca</p>
                    </div>
                `;
                updateStats();
                return;
            }

            const tableHtml = `
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th onclick="sort('LUOGO')">Località ↕</th>
                                <th onclick="sort('NOME')">Impianto ↕</th>
                                <th onclick="sort('TIPOLOGIA')">Tipo ↕</th>
                                <th onclick="sort('COSTRUTTORE')">Costruttore ↕</th>
                                <th onclick="sort('COSTRUZIONE')">Anno ↕</th>
                                <th>Stato</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${filtered.map((item, i) => `
                                <tr onclick="openDetail(${i})">
                                    <td>
                                        <div class="cell-location">
                                            <i class="fas fa-map-marker-alt"></i>
                                            <span>${escape(item.LUOGO)}</span>
                                            <span class="province-badge">${escape(item['PR.'])}</span>
                                        </div>
                                    </td>
                                    <td>
                                        <div class="cell-main">${escape(item.NOME)}</div>
                                        <div class="cell-sub">${escape(item.Resort)}</div>
                                    </td>
                                    <td>${escape(item.TIPOLOGIA)}</td>
                                    <td>${escape(item.COSTRUTTORE)}</td>
                                    <td class="year-cell">${item.COSTRUZIONE || '-'}</td>
                                    <td>
                                        <span class="status-badge ${getStatusClass(item.STATO)}">${escape(item.STATO)}</span>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;

            const cardsHtml = `
                <div class="cards-view">
                    ${filtered.map((item, i) => `
                        <div class="lift-card" onclick="openDetail(${i})">
                            <div class="card-header">
                                <div class="card-title">${escape(item.NOME)}</div>
                                <span class="status-badge ${getStatusClass(item.STATO)}">${escape(item.STATO)}</span>
                            </div>
                            <div class="card-meta">
                                <div class="card-meta-item">
                                    <i class="fas fa-map-marker-alt"></i>
                                    ${escape(item.LUOGO)} (${escape(item['PR.'])})
                                </div>
                                <div class="card-meta-item">
                                    <i class="fas fa-cog"></i>
                                    ${escape(item.TIPOLOGIA)}
                                </div>
                                <div class="card-meta-item">
                                    <i class="fas fa-industry"></i>
                                    ${escape(item.COSTRUTTORE)}
                                </div>
                                <div class="card-meta-item">
                                    <i class="fas fa-calendar"></i>
                                    ${item.COSTRUZIONE || '-'}
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;

            container.innerHTML = tableHtml + cardsHtml;
            updateStats();
        }

        function updateStats() {
            document.getElementById('totalCount').textContent = allData.length;
            document.getElementById('filteredCount').textContent = filtered.length;
        }

        function getStatusClass(stato) {
            if (!stato) return 'status-other';
            if (stato.includes('servizio')) return 'status-active';
            if (stato.includes('Dismess')) return 'status-dismessa';
            return 'status-other';
        }

        function escape(text) {
            if (!text) return '-';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        let sortCol = null;
        let sortAsc = true;

        function sort(col) {
            if (sortCol === col) {
                sortAsc = !sortAsc;
            } else {
                sortCol = col;
                sortAsc = true;
            }
            
            filtered.sort((a, b) => {
                let valA = a[col] || '';
                let valB = b[col] || '';
                
                if (typeof valA === 'number' && typeof valB === 'number') {
                    return sortAsc ? valA - valB : valB - valA;
                }
                
                valA = String(valA).toLowerCase();
                valB = String(valB).toLowerCase();
                
                if (valA < valB) return sortAsc ? -1 : 1;
                if (valA > valB) return sortAsc ? 1 : -1;
                return 0;
            });
            
            render();
        }

        function openDetail(index) {
            const item = filtered[index];
            if (!item) return;

            document.getElementById('detailName').textContent = item.NOME || 'N/D';
            document.getElementById('detailLocation').textContent = `${item.LUOGO} (${item['PR.']})`;
            document.getElementById('detailType').textContent = item.TIPOLOGIA || '-';
            document.getElementById('detailStatus').textContent = item.STATO || '-';
            document.getElementById('detailBuilder').textContent = item.COSTRUTTORE || '-';
            document.getElementById('detailYear').textContent = item.COSTRUZIONE || '-';
            document.getElementById('detailArea').textContent = item.Comprensorio || '-';
            
            const notesBox = document.getElementById('notesBox');
            if (item.Note) {
                document.getElementById('detailNotes').textContent = item.Note;
                notesBox.style.display = 'block';
            } else {
                notesBox.style.display = 'none';
            }

            document.getElementById('overlay').classList.add('active');
            document.getElementById('detailModal').classList.add('active');
        }

        function closeDetail() {
            document.getElementById('overlay').classList.remove('active');
            document.getElementById('detailModal').classList.remove('active');
        }

        function debounce(fn, wait) {
            let timeout;
            return (...args) => {
                clearTimeout(timeout);
                timeout = setTimeout(() => fn(...args), wait);
            };
        }

        // Swipe to close (mobile only)
        let touchStartY = 0;
        const modal = document.getElementById('detailModal');
        
        modal.addEventListener('touchstart', e => {
            if (window.innerWidth >= 768) return;
            touchStartY = e.touches[0].clientY;
        });

        modal.addEventListener('touchmove', e => {
            if (window.innerWidth >= 768) return;
            const touchY = e.touches[0].clientY;
            const diff = touchY - touchStartY;
            if (diff > 0 && modal.scrollTop === 0) {
                modal.style.transform = `translateY(${diff}px)`;
            }
        });

        modal.addEventListener('touchend', e => {
            if (window.innerWidth >= 768) return;
            const touchY = e.changedTouches[0].clientY;
            if (touchY - touchStartY > 100) {
                closeDetail();
            }
            modal.style.transform = '';
        });

        init();
    </script>
</body>
</html>
